<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northport Soccer Parents</title>
  <meta name="description" content="Northport Soccer Parents">
  <!-- What shows when the link is shared in texts, email, Facebook, etc. -->
  <meta property="og:title" content="Northport Soccer Parents">
  <meta property="og:description" content="Northport Soccer Parents">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://northportsoccerparents.github.io/images/background-tile.jpg">
  <style>
    /* ---- Colors: blue & gold ---- */
    :root {
      --gold: #f5c518;
      --blue: #0a204e;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      background: var(--blue);
    }

    /* Background: the same photo (with the creator's name under it)
       repeated across the whole page. Change --tile to make the
       copies bigger or smaller. Fixed layer so it works on iPhones. */
    body::before {
      --tile: 260px;
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("images/background-tile.jpg") top center / var(--tile) auto repeat;
    }
    @media (max-width: 760px) { body::before { --tile: 170px; } }

    /* Title: each line sits on a snug solid-blue label that hugs the
       words only (not a big box), with a gold edge, so it reads
       clearly over the busy photos. */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
    }
    .hero h1, .hero p {
      margin: 0;
      max-width: 100%;
      background: var(--blue);
      border: 3px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.7);
      font-weight: 900;
      letter-spacing: .03em;
    }
    .hero h1 {
      padding: .15em .45em;
      font-size: clamp(2.2rem, 8vw, 5rem);
      line-height: 1.1;
      color: #fff;
    }
    .hero h1 span { color: var(--gold); }
    .hero p {
      margin-top: 18px;
      padding: .35em .8em;
      font-size: clamp(1.25rem, 4vw, 2.2rem);
      line-height: 1.25;
      color: var(--gold);
    }

    /* Featured photos under the title: side by side on computers,
       stacked on phones */
    .photos {
      margin-top: 28px;
      max-width: 1280px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;   /* photos start level at the top */
      gap: 28px;
      width: 100%;
    }
    .featured {
      margin: 0;
      width: min(480px, 100%);
      padding: 8px;
      background: var(--blue);
      border: 4px solid var(--gold);
      border-radius: 14px;
      box-shadow: 0 0 0 4px var(--blue), 0 16px 40px rgba(0,0,0,.8);
    }
    .featured img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .featured img.below {
      margin: 12px auto 0;
      width: 70%;
    }
    .featured img.post { margin-top: 12px; }
    .featured.small { width: min(300px, 100%); }
    .featured.small figcaption { font-size: 1.1rem; }
    .featured .fig-title {
      margin: 4px 4px 12px;
      font-size: clamp(1.2rem, 3.5vw, 1.7rem);
      font-weight: 900;
      line-height: 1.25;
      color: var(--gold);
    }
    .col { display: flex; flex-direction: column; gap: 28px; width: min(480px, 100%); }
    .col > .featured { width: 100%; }
    .featured figcaption {
      margin-top: 10px;
      padding: 6px 4px 2px;
      font-size: clamp(1.2rem, 3.5vw, 1.7rem);
      font-weight: 900;
      line-height: 1.25;
      color: var(--gold);
    }

    /* Section title (e.g. above the DeMarco photos) - same look as the line under the page title */
    .section-title {
      margin: 48px 0 0;
      max-width: 100%;
      padding: .35em .8em;
      background: var(--blue);
      border: 3px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.7);
      font-size: clamp(1.25rem, 4vw, 2.2rem);
      font-weight: 900;
      letter-spacing: .03em;
      line-height: 1.25;
      color: var(--gold);
    }

    footer {
      align-self: center;
      margin: 0 16px 14px;
      padding: 6px 14px;
      font-size: .9rem;
      font-weight: 700;
      background: var(--blue);
      border: 2px solid var(--gold);
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>NORTHPORT <span>SOCCER PARENTS</span></h1>
    <p>THIS IS HOW CLASSLESS NORTHPORT PARENTS ACT</p>
    <div class="photos">
      <div class="col">
        <figure class="featured">
          <h2 class="fig-title">You go to AI to create a hateful image to hurt underage girls</h2>
          <img src="images/featured.jpg" width="1000" height="1580"
               alt="Cartoon of tigers in Northport jerseys cutting the pink manes of crying lions on a soccer field, posted by David Stein">
          <figcaption>West Islip Girls soccer is known as &ldquo;WIGS&rdquo; so you put a WIG on a Lion (West Islip Mascot) and cut their wig off and have it CRY</figcaption>
        </figure>
        <figure class="featured">
          <img src="images/stein-sworn-in-2.jpg" width="700" height="508"
               alt="New vice president David Stein raises his hand as he is sworn into office in the Northport school board. Photo by Wenhao Ma.">
        </figure>
      </div>
      <figure class="featured">
        <img src="images/stein-sworn-in.jpg" width="1060" height="880"
             alt="David Stein being sworn in as Vice President of the Board of Education">
        <figcaption>David Stein, is this how we act?</figcaption>
        <img class="below" src="images/stein.jpg" width="484" height="720" alt="David Stein">
        <img class="post" src="images/stein-post.jpg" width="1206" height="806"
             alt="David Stein Facebook post: Northport Girls Varsity Soccer, NYS AA Champions, Suffolk Section XI Champions, AA At Large Regional Champions, and your ACTUAL TRUE Long Island Champs!!! (last line highlighted)">
      </figure>
    </div>

    <!-- Brett DeMarco section -->
    <h2 class="section-title">LET&rsquo;S NOT FORGET ABOUT THIS CLASSLESS PARENT</h2>
    <div class="photos">
      <figure class="featured">
        <img src="images/demarco-comment.jpg" width="1206" height="1571"
             alt="Screenshot taken at 7:14am of the West Islip Fire Department post, showing a comment by Brett DeMarco posted 8 hours earlier">
        <figcaption>This was viewed at 7:14am and this was posted 8 hours before that, so why are you making these classless comments at 11pm at night?</figcaption>
      </figure>
      <figure class="featured small">
        <img src="images/original-post.jpg" width="700" height="1074"
             alt="The original West Islip Fire Department post from Nov 3 congratulating the West Islip Girls Varsity Soccer team on winning the Long Island Championship for the third consecutive year">
        <figcaption>So you searched the internet to find out anything positive the West Islip girls soccer team did, beating the Garden City soccer team, and you put an asterisk because they got the opportunity to play again. So you are trying to hate on underage girls as a grown man.</figcaption>
      </figure>
      <figure class="featured small">
        <img src="images/demarco.jpg" width="570" height="1111" alt="Brett DeMarco">
        <figcaption>BRETT DEMARCO</figcaption>
      </figure>
    </div>
  </header>

  <footer>&copy; <span id="year"></span> Northport Soccer Parents</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
